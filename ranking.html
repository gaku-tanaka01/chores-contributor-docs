<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>俺のグループ の週間ランキング</title>
  <style>
    body { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; margin: 24px; color: #1f2933; }
    h1 { margin-bottom: 12px; }
    p { margin: 4px 0 16px; }
    table { border-collapse: collapse; width: 100%; max-width: 640px; }
    th, td { border: 1px solid #cbd2d9; padding: 8px 12px; text-align: left; }
    th { background: #f5f7fa; }
    tbody tr:nth-child(even) { background: #f8fafc; }
    .champion { background: #fff9e6 !important; font-weight: bold; }
    .champion td { border-color: #ffd700; }
    .empty { margin-top: 24px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      body { background: #0b0d12; color: #e5e7eb; }
      table { border-color: #2d3748; }
      th, td { border-color: #2d3748; }
      th { background: #1f2937; }
      tbody tr:nth-child(even) { background: #111827; }
      .champion { background: #2d2416 !important; }
      .champion td { border-color: #ffd700; }
    }
  </style>
</head>
<body>
  <h1>俺のグループ の週間ランキング</h1>
  <p>集計期間: 2025-12-08 〜 2025-12-14</p>
  
  <table>
    <thead>
      <tr>
        <th scope="col">順位</th>
        <th scope="col">名前</th>
        <th scope="col">ポイント</th>
      </tr>
    </thead>
    <tbody>
    
      <tr class="champion">
        <td>1</td>
        <td>星瞬</td>
        <td>1160pt</td>
      </tr>
    
      <tr>
        <td>2</td>
        <td>田中 樂空</td>
        <td>600pt</td>
      </tr>
    
      <tr>
        <td>3</td>
        <td>山士家</td>
        <td>400pt</td>
      </tr>
    
    </tbody>
  </table>
  
</body>
</html>
