<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>俺のグループ の週間ランキング</title>

  
  <script src="https://cdn.tailwindcss.com"></script>

  
  <link rel="stylesheet" href="style.css" />
</head>
<body class="max-w-3xl mx-auto p-6 text-slate-800 dark:text-slate-200 dark:bg-slate-900">
  <h1 class="text-3xl font-bold mb-3 text-slate-900 dark:text-slate-100">俺のグループ の週間ランキング</h1>
  <p class="text-slate-600 dark:text-slate-300 mb-4">集計期間: 2025-12-08 〜 2025-12-14</p>
  
  <table class="w-full mt-4 border-collapse border border-slate-300 dark:border-slate-600">
    <thead>
      <tr>
        <th scope="col" class="border border-slate-300 dark:border-slate-600 px-3 py-2 text-left bg-slate-100 dark:bg-slate-800 font-semibold">順位</th>
        <th scope="col" class="border border-slate-300 dark:border-slate-600 px-3 py-2 text-left bg-slate-100 dark:bg-slate-800 font-semibold">名前</th>
        <th scope="col" class="border border-slate-300 dark:border-slate-600 px-3 py-2 text-left bg-slate-100 dark:bg-slate-800 font-semibold">ポイント</th>
      </tr>
    </thead>
    <tbody>
    
      <tr class="bg-amber-50 dark:bg-amber-900/20 font-bold">
        <td class="border border-slate-300 dark:border-slate-600 px-3 py-2 border-amber-300 dark:border-amber-600">1</td>
        <td class="border border-slate-300 dark:border-slate-600 px-3 py-2 border-amber-300 dark:border-amber-600">星瞬</td>
        <td class="border border-slate-300 dark:border-slate-600 px-3 py-2 border-amber-300 dark:border-amber-600">1160pt</td>
      </tr>
    
      <tr class="even:bg-slate-50 dark:even:bg-slate-800/50">
        <td class="border border-slate-300 dark:border-slate-600 px-3 py-2">2</td>
        <td class="border border-slate-300 dark:border-slate-600 px-3 py-2">田中 樂空</td>
        <td class="border border-slate-300 dark:border-slate-600 px-3 py-2">600pt</td>
      </tr>
    
      <tr class="even:bg-slate-50 dark:even:bg-slate-800/50">
        <td class="border border-slate-300 dark:border-slate-600 px-3 py-2">3</td>
        <td class="border border-slate-300 dark:border-slate-600 px-3 py-2">山士家</td>
        <td class="border border-slate-300 dark:border-slate-600 px-3 py-2">400pt</td>
      </tr>
    
    </tbody>
  </table>
  
</body>
</html>
